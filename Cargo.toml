[package]
name = "gds"
version = "0.3.0"
edition = "2021"
description = "GDS - Genshin Dialogs Skipper"
license = "MIT"
repository = "https://github.com/ProstoInside/Genshin-Dialogs-Skipper"
build = "build.rs"

[dependencies]
eframe = "0.29"
fastrand = "2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
